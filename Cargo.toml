[workspace]
resolver = "2"
members = [
    "crates/cratevec-core",
    "crates/cratevec-cli",
    "crates/cratevec-server",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "pcm", "wav"] }
rustfft = "6.2"
futures = "0.3"
urlencoding = "2.1"
regex = "1.10"
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
